name: CE-W03 Native Hope Protection

on:
  push:
    paths:
      - "runtime/arcanum-hope-runtime/**"
      - "runtime/arcanum-android-hope-jni/**"
      - "apps/android/app/src/main/java/org/arcanum/nativehost/hope/**"
      - "apps/android/app/src/test/java/org/arcanum/nativehost/hope/**"
      - "docs/specs/app/hope-reflection.v0.1.json"
      - "scripts/verify-ce-w03.py"
      - ".github/workflows/verify-ce-w03-native-hope.yml"
  pull_request:
    paths:
      - "runtime/arcanum-hope-runtime/**"
      - "runtime/arcanum-android-hope-jni/**"
      - "apps/android/app/src/main/java/org/arcanum/nativehost/hope/**"
      - "apps/android/app/src/test/java/org/arcanum/nativehost/hope/**"
      - "docs/specs/app/hope-reflection.v0.1.json"
      - "scripts/verify-ce-w03.py"
      - ".github/workflows/verify-ce-w03-native-hope.yml"

permissions:
  contents: read

jobs:
  verify-native-hope:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"
          components: rustfmt,clippy
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Verify CE-W03 repository contract
        run: python3 scripts/verify-ce-w03.py

      - name: Check Hope runtime formatting
        run: cargo fmt --manifest-path runtime/arcanum-hope-runtime/Cargo.toml --check

      - name: Clippy Hope runtime
        run: cargo clippy --manifest-path runtime/arcanum-hope-runtime/Cargo.toml --all-targets -- -D warnings

      - name: Test Hope runtime
        run: cargo test --manifest-path runtime/arcanum-hope-runtime/Cargo.toml

      - name: Check Hope JNI formatting
        run: cargo fmt --manifest-path runtime/arcanum-android-hope-jni/Cargo.toml --check

      - name: Clippy Hope JNI
        run: cargo clippy --manifest-path runtime/arcanum-android-hope-jni/Cargo.toml --all-targets -- -D warnings

      - name: Cross-compile all CE-W03 native libraries
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/apps/android/app/src/main/jniLibs"
          for crate in arcanum-android-jni arcanum-android-tempus-lifecycle-jni arcanum-android-hope-jni; do
            (
              cd "runtime/$crate"
              cargo ndk \
                -t arm64-v8a \
                -t x86_64 \
                -o "$GITHUB_WORKSPACE/apps/android/app/src/main/jniLibs" \
                build \
                --release
            )
          done

      - name: Verify exact JNI symbol sets
        shell: bash
        run: |
          NM="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          for abi in arm64-v8a x86_64; do
            bridge_so="apps/android/app/src/main/jniLibs/$abi/libarcanum_android_jni.so"
            tempus_so="apps/android/app/src/main/jniLibs/$abi/libarcanum_android_tempus_lifecycle_jni.so"
            hope_so="apps/android/app/src/main/jniLibs/$abi/libarcanum_android_hope_jni.so"
            test -f "$bridge_so"
            test -f "$tempus_so"
            test -f "$hope_so"

            bridge_actual=$("$NM" -D --defined-only "$bridge_so" | awk '{print $3}' | grep '^Java_org_arcanum_nativehost_runtime_NativeRuntimeBridge_' | sort)
            bridge_expected=$(printf '%s\n' \
              Java_org_arcanum_nativehost_runtime_NativeRuntimeBridge_nativeAbiVersion \
              Java_org_arcanum_nativehost_runtime_NativeRuntimeBridge_nativeCapabilityMask \
              Java_org_arcanum_nativehost_runtime_NativeRuntimeBridge_nativeTempusClockProbe | sort)
            test "$bridge_actual" = "$bridge_expected"

            tempus_actual=$("$NM" -D --defined-only "$tempus_so" | awk '{print $3}' | grep '^Java_org_arcanum_nativehost_tempus_TempusLifecycleBridge_' | sort)
            tempus_expected=$(printf '%s\n' \
              Java_org_arcanum_nativehost_tempus_TempusLifecycleBridge_nativeCapturePersist \
              Java_org_arcanum_nativehost_tempus_TempusLifecycleBridge_nativeRecover | sort)
            test "$tempus_actual" = "$tempus_expected"

            hope_actual=$("$NM" -D --defined-only "$hope_so" | awk '{print $3}' | grep '^Java_org_arcanum_nativehost_hope_HopeRuntimeBridge_' | sort)
            hope_expected=$(printf '%s\n' \
              Java_org_arcanum_nativehost_hope_HopeRuntimeBridge_nativeBuildReflection \
              Java_org_arcanum_nativehost_hope_HopeRuntimeBridge_nativeContract | sort)
            test "$hope_actual" = "$hope_expected"
          done

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unit test protected Hope store and assemble Android host
        run: gradle -p apps/android testDebugUnitTest assembleDebug --stacktrace

      - name: Verify three-library dual-ABI APK packaging
        shell: bash
        run: |
          APK="apps/android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          for abi in arm64-v8a x86_64; do
            unzip -l "$APK" | grep -q "lib/$abi/libarcanum_android_jni.so"
            unzip -l "$APK" | grep -q "lib/$abi/libarcanum_android_tempus_lifecycle_jni.so"
            unzip -l "$APK" | grep -q "lib/$abi/libarcanum_android_hope_jni.so"
          done
