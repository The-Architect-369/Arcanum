name: CE-W03 Contract Verification

on:
  push:
    branches:
      - main
      - "stage/ce-w03-*"
      - "work/ce-w03-*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-ce-w03-contract:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
      - name: Verify CE-W03 contract and implemented tranche invariants
        run: python3 scripts/verify-ce-w03.py
