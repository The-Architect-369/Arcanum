name: CE-W03 Integrated Evidence

on:
  push:
    branches:
      - main
      - "stage/ce-w03-*"
      - "work/ce-w03-*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-ce-w03-integrated:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - name: Checkout exact evidence head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Atman exact-source certification
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main --force
          BASE="$(git merge-base HEAD refs/remotes/origin/main)"
          HEAD_SHA="$(git rev-parse HEAD)"
          echo "Atman exact-source base=$BASE head=$HEAD_SHA"
          git diff --check "$BASE" HEAD

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"
          components: rustfmt,clippy
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Activate pnpm 9.10.0
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@9.10.0 --activate

      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile

      - name: Verify F1-F71 and CE-W03 closure contract
        run: pnpm verify:ce-w03:closure

      - name: Verify doctrine
        run: bash scripts/doctrine-guard.sh

      - name: Verify inherited Rust runtime and safe facades
        shell: bash
        run: |
          cargo fmt --manifest-path runtime/arcanum-runtime/Cargo.toml --all -- --check
          cargo clippy --manifest-path runtime/arcanum-runtime/Cargo.toml --all-targets --all-features -- -D warnings
          cargo test --manifest-path runtime/arcanum-runtime/Cargo.toml --all-targets --all-features
          cargo fmt --manifest-path runtime/arcanum-android-bridge/Cargo.toml --check
          cargo clippy --manifest-path runtime/arcanum-android-bridge/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path runtime/arcanum-android-bridge/Cargo.toml
          cargo fmt --manifest-path runtime/arcanum-android-tempus-lifecycle/Cargo.toml --check
          cargo clippy --manifest-path runtime/arcanum-android-tempus-lifecycle/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path runtime/arcanum-android-tempus-lifecycle/Cargo.toml

      - name: Verify Hope runtime and JNI source
        shell: bash
        run: |
          cargo fmt --manifest-path runtime/arcanum-hope-runtime/Cargo.toml --check
          cargo clippy --manifest-path runtime/arcanum-hope-runtime/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path runtime/arcanum-hope-runtime/Cargo.toml
          cargo fmt --manifest-path runtime/arcanum-android-hope-jni/Cargo.toml --check
          cargo clippy --manifest-path runtime/arcanum-android-hope-jni/Cargo.toml --all-targets -- -D warnings

      - name: Verify inherited mechanical JNI shims
        shell: bash
        run: |
          cargo fmt --manifest-path runtime/arcanum-android-jni/Cargo.toml --check
          cargo clippy --manifest-path runtime/arcanum-android-jni/Cargo.toml --all-targets -- -D warnings
          cargo fmt --manifest-path runtime/arcanum-android-tempus-lifecycle-jni/Cargo.toml --check
          cargo clippy --manifest-path runtime/arcanum-android-tempus-lifecycle-jni/Cargo.toml --all-targets -- -D warnings

      - name: Cross-compile all three native libraries
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/apps/android/app/src/main/jniLibs"
          for crate in arcanum-android-jni arcanum-android-tempus-lifecycle-jni arcanum-android-hope-jni; do
            (
              cd "runtime/$crate"
              cargo ndk \
                -t arm64-v8a \
                -t x86_64 \
                -o "$GITHUB_WORKSPACE/apps/android/app/src/main/jniLibs" \
                build \
                --release
            )
          done

      - name: Verify exact JNI symbol sets
        shell: bash
        run: |
          set -euo pipefail
          NM="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          assert_exact_java_symbols() {
            local library="$1"
            shift
            local actual expected
            actual="$("$NM" -D --defined-only "$library" | awk '{print $3}' | grep '^Java_' | sort)"
            expected="$(printf '%s\n' "$@" | sort)"
            test "$actual" = "$expected"
          }
          for abi in arm64-v8a x86_64; do
            bridge_so="apps/android/app/src/main/jniLibs/$abi/libarcanum_android_jni.so"
            tempus_so="apps/android/app/src/main/jniLibs/$abi/libarcanum_android_tempus_lifecycle_jni.so"
            hope_so="apps/android/app/src/main/jniLibs/$abi/libarcanum_android_hope_jni.so"
            test -f "$bridge_so" && test -f "$tempus_so" && test -f "$hope_so"
            assert_exact_java_symbols "$bridge_so" \
              Java_org_arcanum_nativehost_runtime_NativeRuntimeBridge_nativeAbiVersion \
              Java_org_arcanum_nativehost_runtime_NativeRuntimeBridge_nativeCapabilityMask \
              Java_org_arcanum_nativehost_runtime_NativeRuntimeBridge_nativeTempusClockProbe
            assert_exact_java_symbols "$tempus_so" \
              Java_org_arcanum_nativehost_tempus_TempusLifecycleBridge_nativeCapturePersist \
              Java_org_arcanum_nativehost_tempus_TempusLifecycleBridge_nativeRecover
            assert_exact_java_symbols "$hope_so" \
              Java_org_arcanum_nativehost_hope_HopeRuntimeBridge_nativeBuildReflection \
              Java_org_arcanum_nativehost_hope_HopeRuntimeBridge_nativeContract
          done

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unit test and assemble CE-W03 Android host
        run: gradle -p apps/android testDebugUnitTest assembleDebug --stacktrace

      - name: Verify F72 three-library dual-ABI APK packaging
        shell: bash
        run: |
          APK="apps/android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          for abi in arm64-v8a x86_64; do
            unzip -l "$APK" | grep -q "lib/$abi/libarcanum_android_jni.so"
            unzip -l "$APK" | grep -q "lib/$abi/libarcanum_android_tempus_lifecycle_jni.so"
            unzip -l "$APK" | grep -q "lib/$abi/libarcanum_android_hope_jni.so"
          done

      - name: Upload exact-head Android APK for physical baseline installation
        uses: actions/upload-artifact@v4
        with:
          name: arcanum-ce-w03-physical-baseline-${{ github.sha }}
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Lint web application
        run: pnpm lint

      - name: Typecheck web application
        run: pnpm typecheck

      - name: Build web application
        run: pnpm build

      - name: Verify deterministic repository index on indexed heads
        shell: bash
        run: |
          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          if [[ "$BRANCH" == work/ce-w03-* || "$BRANCH" == "main" ]]; then
            pnpm verify:repo-index
          else
            echo "repo-index companion intentionally deferred on exact-source branch: $BRANCH"
          fi

      - name: Record exact-head F72 evidence
        shell: bash
        run: |
          echo "F72 exact head: $(git rev-parse HEAD)"
          echo "Three JNI libraries x two ABIs packaged; Android tests/APK and web build passed."
