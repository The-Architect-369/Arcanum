name: CE-W04 A18 Local Conversation Candidate
on:
  push:
    paths:
      - "runtime/arcanum-runtime/**"
      - "runtime/arcanum-android-continuity-jni/**"
      - "apps/android/**"
      - "scripts/conversation/**"
      - "docs/specs/runtime/ce-w04-a18-*"
      - ".github/workflows/verify-ce-w04-a18-conversation.yml"
  pull_request:
    paths:
      - "runtime/arcanum-runtime/**"
      - "runtime/arcanum-android-continuity-jni/**"
      - "apps/android/**"
      - "scripts/conversation/**"
      - "docs/specs/runtime/ce-w04-a18-*"
      - ".github/workflows/verify-ce-w04-a18-conversation.yml"
permissions:
  contents: read
jobs:
  a18-conversation:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: ""
      - name: Install qualified SDK and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"
          components: rustfmt,clippy
          targets: aarch64-linux-android,x86_64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Verify local conversation gateway
        run: python3 -m unittest discover -s scripts/conversation -v
      - name: Verify A16 JNI source
        run: |
          cargo fetch --manifest-path runtime/arcanum-android-continuity-jni/Cargo.toml --locked
          cargo fmt --manifest-path runtime/arcanum-android-continuity-jni/Cargo.toml --check
          cargo clippy --manifest-path runtime/arcanum-android-continuity-jni/Cargo.toml --all-targets --locked --offline -- -D warnings
          rustup toolchain install 1.82.0 --profile minimal
          cargo +1.82.0 fetch --manifest-path runtime/arcanum-android-continuity-jni/Cargo.toml --locked
          cargo +1.82.0 check --manifest-path runtime/arcanum-android-continuity-jni/Cargo.toml --locked --offline
      - name: Build all four native libraries for both ABIs
        run: |
          for crate in arcanum-android-jni arcanum-android-tempus-lifecycle-jni arcanum-android-hope-jni arcanum-android-continuity-jni; do
            if [ "$crate" = "arcanum-android-jni" ] || [ "$crate" = "arcanum-android-continuity-jni" ]; then
              (cd "runtime/$crate" && cargo ndk -t arm64-v8a -t x86_64 -o "$GITHUB_WORKSPACE/apps/android/app/src/main/jniLibs" build --release --locked)
            else
              (cd "runtime/$crate" && cargo ndk -t arm64-v8a -t x86_64 -o "$GITHUB_WORKSPACE/apps/android/app/src/main/jniLibs" build --release)
            fi
          done
      - name: Verify closed A16 JNI symbols
        run: |
          for abi in arm64-v8a x86_64; do
            actual="$($ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm -D --defined-only apps/android/app/src/main/jniLibs/$abi/libarcanum_android_continuity_jni.so | awk '{print $3}' | grep '^Java_' | sort)"
            expected="$(printf '%s\n' nativeWireVersion nativePrepare nativeInspect nativeCommit nativePublish nativeRecover | sed 's/^/Java_org_arcanum_nativehost_continuity_ContinuityNativeBridge_/' | sort)"
            test "$actual" = "$expected"
          done
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build bound isolated qualification pair and instrumentation APK
        run: |
          set -euo pipefail
          trap 'printf "Artifact validation failed at shell line %s\n" "$LINENO"' ERR
          mkdir -p "$RUNNER_TEMP/a18-qualification"
          source_head="$(git rev-parse HEAD)"
          gradle -p apps/android testDebugUnitTest assembleQualification assembleQualificationAndroidTest -ParcanumQualificationArc=A18 -ParcanumSourceCommit="$source_head" -ParcanumQualificationVersionCode=30 --stacktrace
          cp apps/android/app/build/outputs/apk/qualification/app-qualification.apk "$RUNNER_TEMP/a18-qualification/arcanum-a18-qualification-30.apk"
          cp apps/android/app/build/outputs/apk/androidTest/qualification/app-qualification-androidTest.apk "$RUNNER_TEMP/a18-qualification/arcanum-a18-qualification-tests.apk"
          gradle -p apps/android assembleQualification -ParcanumQualificationArc=A18 -ParcanumSourceCommit="$source_head" -ParcanumQualificationVersionCode=31 --stacktrace
          cp apps/android/app/build/outputs/apk/qualification/app-qualification.apk "$RUNNER_TEMP/a18-qualification/arcanum-a18-qualification-31.apk"
          printf '%s\n' "$source_head" > "$RUNNER_TEMP/a18-qualification/source-commit.txt"
          cd "$RUNNER_TEMP/a18-qualification"
          sha256sum *.apk > sha256sums.txt
          for apk in *.apk; do
            "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --print-certs "$apk" > "$apk.signer.txt"
            "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$apk" > "$apk.package.txt"
          done
          certificate="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' arcanum-a18-qualification-30.apk.signer.txt)"
          test -n "$certificate"
          for apk in *.apk; do
            test "$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$apk.signer.txt")" = "$certificate"
          done
          for version in 30 31; do
            grep -q "^package: name='org.arcanum.nativehost.a18qualification' versionCode='$version'" "arcanum-a18-qualification-$version.apk.package.txt"
            for abi in arm64-v8a x86_64; do
              for library in arcanum_android_jni arcanum_android_tempus_lifecycle_jni arcanum_android_hope_jni arcanum_android_continuity_jni; do
                unzip -l "arcanum-a18-qualification-$version.apk" | grep "lib/$abi/lib$library.so" >/dev/null
              done
            done
          done
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump xmltree arcanum-a18-qualification-tests.apk AndroidManifest.xml > arcanum-a18-qualification-tests.apk.manifest.txt
          grep -q 'android:name.*"androidx.test.runner.AndroidJUnitRunner"' arcanum-a18-qualification-tests.apk.manifest.txt
          grep -q 'android:targetPackage.*"org.arcanum.nativehost.a18qualification"' arcanum-a18-qualification-tests.apk.manifest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: a18-isolated-qualification-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/a18-qualification/
          if-no-files-found: error
          retention-days: 14
      - name: Build original-package update with the existing publisher signer
        env:
          ARCANUM_DEV_KEYSTORE_B64: ${{ secrets.ARCANUM_DEV_KEYSTORE_B64 }}
          ORG_GRADLE_PROJECT_arcanumDevStorePassword: ${{ secrets.ARCANUM_DEV_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_arcanumDevKeyAlias: ${{ secrets.ARCANUM_DEV_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_arcanumDevKeyPassword: ${{ secrets.ARCANUM_DEV_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$ARCANUM_DEV_KEYSTORE_B64"
          test -n "$ORG_GRADLE_PROJECT_arcanumDevStorePassword"
          test -n "$ORG_GRADLE_PROJECT_arcanumDevKeyAlias"
          test -n "$ORG_GRADLE_PROJECT_arcanumDevKeyPassword"
          export ORG_GRADLE_PROJECT_arcanumDevKeystorePath="$RUNNER_TEMP/a18-publisher.jks"
          trap 'rm -f "$ORG_GRADLE_PROJECT_arcanumDevKeystorePath"' EXIT
          printf '%s' "$ARCANUM_DEV_KEYSTORE_B64" | base64 --decode > "$ORG_GRADLE_PROJECT_arcanumDevKeystorePath"
          source_head="$(git rev-parse HEAD)"
          gradle -p apps/android assembleDebug assembleDebugAndroidTest -ParcanumQualificationArc=A18 -ParcanumTestBuildType=debug -ParcanumSourceCommit="$source_head" --stacktrace
          mkdir -p "$RUNNER_TEMP/a18-original-update"
          cp apps/android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/a18-original-update/arcanum-a18-update-33.apk"
          cp apps/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk "$RUNNER_TEMP/a18-original-update/arcanum-a18-original-ui-tests.apk"
          cd "$RUNNER_TEMP/a18-original-update"
          printf '%s\n' "$source_head" > source-commit.txt
          for apk in *.apk; do
            "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --print-certs "$apk" > "$apk.signer.txt"
            grep -q '^Signer #1 certificate SHA-256 digest: 9841fbeda4d7d0c63b1663360fb0415218a08f063b5629317274076dfbb6b844$' "$apk.signer.txt"
          done
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging arcanum-a18-update-33.apk > package.txt
          grep -q "^package: name='org.arcanum.nativehost' versionCode='33'" package.txt
          for abi in arm64-v8a x86_64; do
            for library in arcanum_android_jni arcanum_android_tempus_lifecycle_jni arcanum_android_hope_jni arcanum_android_continuity_jni; do
              unzip -l arcanum-a18-update-33.apk | grep "lib/$abi/lib$library.so" >/dev/null
            done
          done
          sha256sum *.apk > sha256sums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: a18-original-update-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/a18-original-update/
          if-no-files-found: error
          retention-days: 14
