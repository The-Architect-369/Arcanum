name: Architect Verification Evidence

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      wave:
        description: Construction/wave identifier
        required: false
        default: unspecified

permissions:
  contents: read

jobs:
  attest:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout exact evidence commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y jq

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify repository integrity
        id: verify_sync
        run: bash scripts/verify-sync.sh

      - name: Lint web application
        id: lint
        run: pnpm lint

      - name: Typecheck web application
        id: typecheck
        run: pnpm typecheck

      - name: Build web application
        id: build
        run: pnpm build

      - name: Generate exact-head Architect attestation
        env:
          ARCANUM_WAVE: ${{ inputs.wave || 'unspecified' }}
          ARCANUM_VERIFY_SYNC_RESULT: ${{ steps.verify_sync.outcome }}
          ARCANUM_LINT_RESULT: ${{ steps.lint.outcome }}
          ARCANUM_TYPECHECK_RESULT: ${{ steps.typecheck.outcome }}
          ARCANUM_BUILD_RESULT: ${{ steps.build.outcome }}
          GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: bash scripts/architect/ci-attest.sh

      - name: Upload Architect attestation
        uses: actions/upload-artifact@v4
        with:
          name: architect-verification-${{ github.event.pull_request.head.sha || github.sha }}
          path: .architect-reports/ci/verification-attestation.json
          if-no-files-found: error
          retention-days: 30
