name: CE-W02 Android Runtime Bridge

on:
  push:
    paths:
      - "runtime/arcanum-runtime/src/lib.rs"
      - "runtime/arcanum-android-bridge/**"
      - "runtime/arcanum-android-jni/**"
      - "apps/android/**"
      - "docs/specs/runtime/android-runtime-bridge*"
      - "scripts/verify-ce-w02-native-shell.py"
      - "scripts/verify-ce-w02-native-bridge.py"
      - "package.json"
      - ".gitignore"
      - ".github/workflows/verify-android-bridge.yml"
  pull_request:
    paths:
      - "runtime/arcanum-runtime/src/lib.rs"
      - "runtime/arcanum-android-bridge/**"
      - "runtime/arcanum-android-jni/**"
      - "apps/android/**"
      - "docs/specs/runtime/android-runtime-bridge*"
      - "scripts/verify-ce-w02-native-shell.py"
      - "scripts/verify-ce-w02-native-bridge.py"
      - "package.json"
      - ".gitignore"
      - ".github/workflows/verify-android-bridge.yml"

jobs:
  verify-android-bridge:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Verify W02.3 repository contract
        run: python3 scripts/verify-ce-w02-native-bridge.py

      - name: Verify safe bridge facade
        run: |
          cargo fmt --manifest-path runtime/arcanum-android-bridge/Cargo.toml --check
          cargo clippy --manifest-path runtime/arcanum-android-bridge/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path runtime/arcanum-android-bridge/Cargo.toml

      - name: Verify mechanical JNI shim
        run: |
          cargo fmt --manifest-path runtime/arcanum-android-jni/Cargo.toml --check
          cargo clippy --manifest-path runtime/arcanum-android-jni/Cargo.toml --all-targets -- -D warnings

      - name: Cross-compile JNI shim
        run: |
          rm -rf apps/android/app/src/main/jniLibs
          cargo ndk \
            -t arm64-v8a \
            -t x86_64 \
            -o apps/android/app/src/main/jniLibs \
            build \
            --manifest-path runtime/arcanum-android-jni/Cargo.toml \
            --release

      - name: Verify exported JNI symbols
        shell: bash
        run: |
          NM="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          for abi in arm64-v8a x86_64; do
            so="apps/android/app/src/main/jniLibs/$abi/libarcanum_android_jni.so"
            test -f "$so"
            "$NM" -D --defined-only "$so" | grep -q "Java_org_arcanum_nativehost_runtime_NativeRuntimeBridge_nativeAbiVersion"
            "$NM" -D --defined-only "$so" | grep -q "Java_org_arcanum_nativehost_runtime_NativeRuntimeBridge_nativeCapabilityMask"
            "$NM" -D --defined-only "$so" | grep -q "Java_org_arcanum_nativehost_runtime_NativeRuntimeBridge_nativeTempusClockProbe"
          done

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unit test and assemble Android host with bridge
        run: gradle -p apps/android testDebugUnitTest assembleDebug --stacktrace

      - name: Verify bridge packaging
        shell: bash
        run: |
          APK="apps/android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libarcanum_android_jni.so"
          unzip -l "$APK" | grep -q "lib/x86_64/libarcanum_android_jni.so"
