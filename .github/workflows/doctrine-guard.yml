name: Doctrine Guard

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  doctrine-guard:
    name: Enforce Arcanum Constitution
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout exact doctrine commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y jq

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Activate pnpm 9.10.0
        run: |
          corepack enable
          corepack prepare pnpm@9.10.0 --activate

      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile

      - name: Ensure bash is available
        run: |
          which bash
          bash --version

      - name: Make doctrine guard executable
        run: chmod +x scripts/doctrine-guard.sh

      - name: Run doctrine guard
        run: bash scripts/doctrine-guard.sh

      - name: Verify Sync & Generate Repo Index
        run: bash scripts/verify-sync.sh
