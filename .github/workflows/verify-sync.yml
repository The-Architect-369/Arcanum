name: Verify Sync

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify-sync:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout exact verification commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y jq tree python3-yaml

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Activate pnpm 9.10.0
        run: |
          corepack enable
          corepack prepare pnpm@9.10.0 --activate

      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile

      - name: Run verify sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/verify-sync.sh
