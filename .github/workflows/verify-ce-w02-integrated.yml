name: CE-W02 Integrated Evidence

on:
  push:
    paths:
      - "docs/specs/geometry/**"
      - "docs/specs/app/**"
      - "docs/specs/runtime/**"
      - "docs/repo/repo-index.json"
      - "apps/android/**"
      - "apps/web/**"
      - "runtime/arcanum-runtime/**"
      - "runtime/arcanum-android-bridge/**"
      - "runtime/arcanum-android-jni/**"
      - "runtime/arcanum-android-tempus-lifecycle/**"
      - "runtime/arcanum-android-tempus-lifecycle-jni/**"
      - "scripts/verify-ce-w01-specs.py"
      - "scripts/verify-ce-w02-*.py"
      - "scripts/doctrine-guard.sh"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/verify-android-native.yml"
      - ".github/workflows/verify-android-bridge.yml"
      - ".github/workflows/verify-android-tempus-lifecycle.yml"
      - ".github/workflows/verify-ce-w02-integrated.yml"
  pull_request:
    paths:
      - "docs/specs/geometry/**"
      - "docs/specs/app/**"
      - "docs/specs/runtime/**"
      - "docs/repo/repo-index.json"
      - "apps/android/**"
      - "apps/web/**"
      - "runtime/arcanum-runtime/**"
      - "runtime/arcanum-android-bridge/**"
      - "runtime/arcanum-android-jni/**"
      - "runtime/arcanum-android-tempus-lifecycle/**"
      - "runtime/arcanum-android-tempus-lifecycle-jni/**"
      - "scripts/verify-ce-w01-specs.py"
      - "scripts/verify-ce-w02-*.py"
      - "scripts/doctrine-guard.sh"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/verify-android-native.yml"
      - ".github/workflows/verify-android-bridge.yml"
      - ".github/workflows/verify-android-tempus-lifecycle.yml"
      - ".github/workflows/verify-ce-w02-integrated.yml"

jobs:
  verify-ce-w02-integrated:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"
          components: rustfmt,clippy
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Activate pnpm 9.10.0
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@9.10.0 --activate

      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile

      - name: Verify CE-W02 F1-F60 integrated contract
        run: pnpm verify:ce-w02:integrated

      - name: Verify doctrine
        run: bash scripts/doctrine-guard.sh

      - name: Verify Rust runtime and safe facades
        shell: bash
        run: |
          cargo fmt --manifest-path runtime/arcanum-runtime/Cargo.toml --all -- --check
          cargo clippy --manifest-path runtime/arcanum-runtime/Cargo.toml --all-targets --all-features -- -D warnings
          cargo test --manifest-path runtime/arcanum-runtime/Cargo.toml --all-targets --all-features

          cargo fmt --manifest-path runtime/arcanum-android-bridge/Cargo.toml --check
          cargo clippy --manifest-path runtime/arcanum-android-bridge/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path runtime/arcanum-android-bridge/Cargo.toml

          cargo fmt --manifest-path runtime/arcanum-android-tempus-lifecycle/Cargo.toml --check
          cargo clippy --manifest-path runtime/arcanum-android-tempus-lifecycle/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path runtime/arcanum-android-tempus-lifecycle/Cargo.toml

      - name: Verify mechanical JNI shims
        shell: bash
        run: |
          cargo fmt --manifest-path runtime/arcanum-android-jni/Cargo.toml --check
          cargo clippy --manifest-path runtime/arcanum-android-jni/Cargo.toml --all-targets -- -D warnings

          cargo fmt --manifest-path runtime/arcanum-android-tempus-lifecycle-jni/Cargo.toml --check
          cargo clippy --manifest-path runtime/arcanum-android-tempus-lifecycle-jni/Cargo.toml --all-targets -- -D warnings

      - name: Cross-compile both native libraries
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/apps/android/app/src/main/jniLibs"
          (
            cd runtime/arcanum-android-jni
            cargo ndk \
              -t arm64-v8a \
              -t x86_64 \
              -o "$GITHUB_WORKSPACE/apps/android/app/src/main/jniLibs" \
              build \
              --release
          )
          (
            cd runtime/arcanum-android-tempus-lifecycle-jni
            cargo ndk \
              -t arm64-v8a \
              -t x86_64 \
              -o "$GITHUB_WORKSPACE/apps/android/app/src/main/jniLibs" \
              build \
              --release
          )

      - name: Verify exact JNI symbol sets
        shell: bash
        run: |
          set -euo pipefail
          NM="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"

          assert_exact_java_symbols() {
            local library="$1"
            shift
            local actual expected
            actual="$("$NM" -D --defined-only "$library" | awk '{print $3}' | grep '^Java_' | sort)"
            expected="$(printf '%s\n' "$@" | sort)"
            test "$actual" = "$expected"
          }

          for abi in arm64-v8a x86_64; do
            bridge_so="apps/android/app/src/main/jniLibs/$abi/libarcanum_android_jni.so"
            lifecycle_so="apps/android/app/src/main/jniLibs/$abi/libarcanum_android_tempus_lifecycle_jni.so"

            test -f "$bridge_so"
            test -f "$lifecycle_so"

            assert_exact_java_symbols "$bridge_so" \
              Java_org_arcanum_nativehost_runtime_NativeRuntimeBridge_nativeAbiVersion \
              Java_org_arcanum_nativehost_runtime_NativeRuntimeBridge_nativeCapabilityMask \
              Java_org_arcanum_nativehost_runtime_NativeRuntimeBridge_nativeTempusClockProbe

            assert_exact_java_symbols "$lifecycle_so" \
              Java_org_arcanum_nativehost_tempus_TempusLifecycleBridge_nativeCapturePersist \
              Java_org_arcanum_nativehost_tempus_TempusLifecycleBridge_nativeRecover
          done

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unit test and assemble integrated Android host
        run: gradle -p apps/android testDebugUnitTest assembleDebug --stacktrace

      - name: Verify integrated APK packaging
        shell: bash
        run: |
          APK="apps/android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          for abi in arm64-v8a x86_64; do
            unzip -l "$APK" | grep -q "lib/$abi/libarcanum_android_jni.so"
            unzip -l "$APK" | grep -q "lib/$abi/libarcanum_android_tempus_lifecycle_jni.so"
          done

      - name: Lint web application
        run: pnpm lint

      - name: Typecheck web application
        run: pnpm typecheck

      - name: Build web application
        run: pnpm build
