[package]
name = "arcanum-runtime"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
p256 = { version = "=0.13.2", default-features = false, features = ["ecdsa", "std"] }
sha2 = { version = "=0.10.9", default-features = false, features = ["std"] }

[dev-dependencies]
rand_core = { version = "=0.6.4", features = ["getrandom"] }
