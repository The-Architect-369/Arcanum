<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Vitae Tree variant traversal comparison</title>
<desc id="desc">Western Cordoveran-style and Lurianic Safed-style twenty-two-path Tree variants with the ten-station Vitae class sequence overlaid. The Western variant matches eight of nine transitions; the Lurianic variant matches all nine.</desc>
<style>
  .bg { fill:#fafafa; }
  text { font-family: system-ui, sans-serif; fill:#171717; }
  .paneltitle { font-size:22px; font-weight:700; text-anchor:middle; }
  .status { font-size:14px; text-anchor:middle; fill:#555; }
  .edge { stroke-width:2.1; opacity:.72; }
  .edge.h { stroke:#7c3aed; }
  .edge.v { stroke:#0f766e; }
  .edge.d { stroke:#64748b; stroke-dasharray:5 4; }
  .path { stroke:#111827; stroke-width:7; opacity:.72; stroke-linecap:round; }
  .missing { stroke:#b91c1c; stroke-width:7; stroke-dasharray:10 7; opacity:.88; }
  .node { fill:white; stroke:#111827; stroke-width:2.5; }
  .num { font-size:12px; font-weight:700; text-anchor:middle; }
  .label { font-size:10.5px; text-anchor:middle; }
  .legend { font-size:13px; }
  .note { font-size:14px; fill:#333; }
  .rule { stroke:#d4d4d8; stroke-width:1; }
</style>
