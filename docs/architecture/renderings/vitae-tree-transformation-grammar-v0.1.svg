<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Vitae Tree transformation grammar v0.1</title>
<desc id="desc">Design-candidate rendering of the Lurianic Safed-style Vitae ten-station walk. Vertical paths become frequency-only rises, horizontal paths become pan-only crossings, and diagonal paths combine pitch rise with pan movement. The current two-dimensional walk has zero net lateral drift and six levels of ascent.</desc>
<defs>
  <marker id="arrowV" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2563eb"/></marker>
  <marker id="arrowH" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#7c3aed"/></marker>
  <marker id="arrowD" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#059669"/></marker>
  <style>
    text{font-family:system-ui,-apple-system,sans-serif;fill:#171717}
    .muted{fill:#5b6470}.small{font-size:14px}.tiny{font-size:12px}.head{font-size:26px;font-weight:700}.sub{font-size:18px;font-weight:650}.node{fill:#fff;stroke:#1f2937;stroke-width:2}.base{stroke:#cbd5e1;stroke-width:2}.v{stroke:#2563eb;stroke-width:6;fill:none;marker-end:url(#arrowV)}.h{stroke:#7c3aed;stroke-width:6;fill:none;marker-end:url(#arrowH)}.d{stroke:#059669;stroke-width:6;fill:none;marker-end:url(#arrowD)}.card{fill:#fff;stroke:#d4d4d8;stroke-width:1.5}.rule{stroke:#e5e7eb;stroke-width:1}.pill{rx:12;ry:12}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  </style>
</defs>
<rect width="1200" height="900" fill="#fafafa"/>
<text x="48" y="48" class="head">Vitae Tree transformation grammar v0.1</text>
<text x="48" y="76" class="small muted">Projection only: geometry drives an audible operator; no station, path, letter, planet, or participant owns a fixed pitch or frequency.</text>

<rect x="36" y="98" width="560" height="690" rx="18" class="card"/>
<text x="60" y="132" class="sub">1. Registered walk as typed transformations</text>
<text x="60" y="156" class="small muted">Blue = vertical / Double-class slot · Purple = horizontal / Mother-class slot · Green = diagonal / Simple-class slot</text>

<!-- faint Tree scaffold -->
<g class="base">
  <line x1="190" y1="245" x2="450" y2="245"/><line x1="190" y1="345" x2="450" y2="345"/><line x1="190" y1="545" x2="450" y2="545"/>
  <line x1="320" y1="180" x2="320" y2="445"/><line x1="190" y1="245" x2="190" y2="345"/><line x1="190" y1="345" x2="190" y2="545"/><line x1="450" y1="245" x2="450" y2="345"/><line x1="450" y1="345" x2="450" y2="545"/><line x1="320" y1="445" x2="320" y2="640"/><line x1="320" y1="640" x2="320" y2="730"/>
  <line x1="320" y1="180" x2="190" y2="245"/><line x1="320" y1="180" x2="450" y2="245"/><line x1="190" y1="245" x2="320" y2="445"/><line x1="450" y1="245" x2="320" y2="445"/><line x1="190" y1="345" x2="320" y2="445"/><line x1="450" y1="345" x2="320" y2="445"/><line x1="320" y1="445" x2="190" y2="545"/><line x1="320" y1="445" x2="450" y2="545"/><line x1="190" y1="545" x2="320" y2="640"/><line x1="450" y1="545" x2="320" y2="640"/><line x1="190" y1="245" x2="450" y2="345"/><line x1="450" y1="245" x2="190" y2="345"/>
</g>
<!-- directed Vitae walk -->
<line class="v" x1="320" y1="718" x2="320" y2="652"/>
<line class="d" x1="332" y1="628" x2="432" y2="558"/>
<line class="h" x1="422" y1="545" x2="218" y2="545"/>
<line class="d" x1="210" y1="530" x2="302" y2="458"/>
<line class="d" x1="338" y1="430" x2="430" y2="358"/>
<line class="h" x1="422" y1="345" x2="218" y2="345"/>
<line class="d" x1="216" y1="332" x2="424" y2="258"/>
<line class="h" x1="422" y1="245" x2="218" y2="245"/>
<line class="d" x1="210" y1="232" x2="301" y2="190"/>

<!-- nodes -->
<g><circle class="node" cx="320" cy="730" r="24"/><text x="320" y="735" text-anchor="middle" class="tiny">Malkuth</text></g>
<g><circle class="node" cx="320" cy="640" r="24"/><text x="320" y="645" text-anchor="middle" class="tiny">Yesod</text></g>
<g><circle class="node" cx="450" cy="545" r="24"/><text x="450" y="550" text-anchor="middle" class="tiny">Hod</text></g>
<g><circle class="node" cx="190" cy="545" r="24"/><text x="190" y="550" text-anchor="middle" class="tiny">Netzach</text></g>
<g><circle class="node" cx="320" cy="445" r="24"/><text x="320" y="450" text-anchor="middle" class="tiny">Tiferet</text></g>
<g><circle class="node" cx="450" cy="345" r="24"/><text x="450" y="350" text-anchor="middle" class="tiny">Gevurah</text></g>
<g><circle class="node" cx="190" cy="345" r="24"/><text x="190" y="350" text-anchor="middle" class="tiny">Chesed</text></g>
<g><circle class="node" cx="450" cy="245" r="24"/><text x="450" y="250" text-anchor="middle" class="tiny">Binah</text></g>
<g><circle class="node" cx="190" cy="245" r="24"/><text x="190" y="250" text-anchor="middle" class="tiny">Chokhmah</text></g>
<g><circle class="node" cx="320" cy="180" r="24"/><text x="320" y="185" text-anchor="middle" class="tiny">Keter</text></g>

<text x="60" y="775" class="small mono">operator score: V · D · H · D · D · H · D · H · D</text>

<rect x="620" y="98" width="544" height="294" rx="18" class="card"/>
<text x="644" y="132" class="sub">2. Geometry-driven auditory operators</text>
<line x1="644" y1="153" x2="1140" y2="153" class="rule"/>
<circle cx="662" cy="190" r="8" fill="#2563eb"/><text x="682" y="195" class="small"><tspan font-weight="700">Vertical / Double slot</tspan> — pitch rises, pan stays centered</text>
<text x="682" y="219" class="tiny muted">audio cue: frequency glide only · plain language: “rise while remaining centered”</text>
<circle cx="662" cy="258" r="8" fill="#7c3aed"/><text x="682" y="263" class="small"><tspan font-weight="700">Horizontal / Mother slot</tspan> — pan crosses, pitch stays level</text>
<text x="682" y="287" class="tiny muted">audio cue: stereo traversal only · plain language: “cross the field while remaining level”</text>
<circle cx="662" cy="326" r="8" fill="#059669"/><text x="682" y="331" class="small"><tspan font-weight="700">Diagonal / Simple slot</tspan> — pitch rises while pan moves</text>
<text x="682" y="355" class="tiny muted">audio cue: frequency glide + stereo traversal · plain language: “rise while crossing”</text>

<rect x="620" y="414" width="544" height="374" rx="18" class="card"/>
<text x="644" y="448" class="sub">3. A new rendered invariant: lateral balance</text>
<text x="644" y="478" class="small muted">Current 2D coordinates: left = −1 · center = 0 · right = +1</text>
<line x1="644" y1="500" x2="1140" y2="500" class="rule"/>
<text x="658" y="532" class="small">Three horizontal/Mother crossings</text>
<text x="1115" y="532" text-anchor="end" class="small mono">Σdx = −6</text>
<rect x="658" y="546" width="420" height="18" rx="9" fill="#ede9fe"/><rect x="658" y="546" width="210" height="18" rx="9" fill="#7c3aed"/>
<text x="658" y="598" class="small">Five diagonal/Simple ascents</text>
<text x="1115" y="598" text-anchor="end" class="small mono">Σdx = +6</text>
<rect x="658" y="612" width="420" height="18" rx="9" fill="#d1fae5"/><rect x="868" y="612" width="210" height="18" rx="9" fill="#059669"/>
<text x="658" y="662" class="small">One vertical/Double ascent</text>
<text x="1115" y="662" text-anchor="end" class="small mono">Σdx = 0</text>
<text x="658" y="704" class="small mono">net lateral displacement = 0</text>
<text x="658" y="730" class="small mono">net vertical displacement = −6 levels</text>
<text x="658" y="760" class="tiny muted">The full-width Chesed → Binah diagonal contributes +2 lateral units and is the Lurianic/Safed variant edge that keeps the ten-station walk contiguous.</text>

<rect x="36" y="812" width="1128" height="58" rx="14" fill="#fff7ed" stroke="#fdba74"/>
<text x="56" y="838" class="small" font-weight="700">Research posture:</text>
<text x="183" y="838" class="small">the exact left/right signs reverse under a mirror render, but the balance of opposing lateral motion remains.</text>
<text x="56" y="859" class="tiny muted">This is a property of the registered walk plus presentation coordinates—not a historical doctrine, sacred-frequency proof, or advancement mechanism.</text>
</svg>