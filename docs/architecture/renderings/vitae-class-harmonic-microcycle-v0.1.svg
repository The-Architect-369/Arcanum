<line class="rule" x1="45" y1="650" x2="1155" y2="650"/><text class="note" x="45" y="680"><tspan class="strong">Important:</tspan> the 35-cell torus scan is not curriculum order, and the 12-pitch cycle is not a planet, element, Hebrew-letter, or zodiac doctrine.</text><text class="note" x="45" y="707">The render tests periodicity and memorability only. Recognition, authority, Tempus advancement, and human worth remain unaffected.</text><text class="sub" x="45" y="735">Design-candidate projection — plain list/tree access remains required.</text></svg>