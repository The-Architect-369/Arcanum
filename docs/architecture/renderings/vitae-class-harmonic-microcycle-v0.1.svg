<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title2 desc2">
<title id="title2">Vitae 36-position class microcycle</title>
<desc id="desc2">A class overview anchor plus a seven-by-five chapter and section product gives 36 positions. A separate optional circle-of-fifths sonification repeats twelve pitch classes three times across the 36 positions.</desc>
<style>.bg{fill:#fafafa} text{font-family:system-ui,sans-serif;fill:#171717}.title{font-size:24px;font-weight:700}.sub{font-size:14px;fill:#555}.anchorbox{fill:#fff7ed;stroke:#9a3412;stroke-width:2}.cell{fill:white;stroke:#94a3b8;stroke-width:1.4}.celltext{font-size:12px;text-anchor:middle}.rowlabel{font-size:13px;font-weight:600}.collabel{font-size:12px;font-weight:600;text-anchor:middle}.ring{fill:none;stroke:#cbd5e1;stroke-width:2}.slot{fill:white;stroke:#475569;stroke-width:1.5}.cyclemark{fill:#e0f2fe;stroke:#0369a1;stroke-width:2}.anchor{fill:#ffedd5;stroke:#9a3412;stroke-width:2.5}.ringsmall{font-size:10px;text-anchor:middle;fill:#334155}.note{font-size:14px;fill:#333}.strong{font-weight:700}.rule{stroke:#d4d4d8;stroke-width:1}</style>
