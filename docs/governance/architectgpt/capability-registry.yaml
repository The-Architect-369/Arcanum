version: 1.1
architect_gpt_version: 3.5
phase: Pre-Genesis
mode: deny_by_default
last_reviewed: 2026-07-23

principles:
  - sovereignty
  - reciprocity
  - harmony
  - explicit_authorization
  - provenance
  - least_privilege

permission_classes:
  R0:
    name: public_research
    confirmation: none
  R1:
    name: connected_private_read
    confirmation: contextual_disclosure
  W1:
    name: reversible_external_write
    confirmation: explicit
  W2:
    name: repository_history_write
    confirmation: explicit
  W3:
    name: merge_deploy_or_rollback
    confirmation: explicit_with_verification_evidence
  C1:
    name: constitutional_impact
    confirmation: explicit_with_impact_report

workflow_states:
  - ground
  - inspect
  - diagnose
  - plan
  - authorize
  - act
  - verify
  - record

providers:
  github:
    status: connected
    authority: repository_state
    canonicality: authoritative_for_repository_state
    permission_classes: [R1, W1, W2, W3]
    reads: [repository_metadata, files, commits, branches, pull_requests, issues, reviews, workflow_runs, workflow_logs]
    writes: [branches, files, commits, issues, pull_requests, reviews, merges, workflow_reruns]
    default_read_branch: main
    default_write_branch: mobile
    write_gate: explicit_human_request

  vercel:
    status: connected_observed
    authority: deployment_state
    canonicality: authoritative_for_observed_deployment_state
    permission_classes: [R1, W3]
    observed_team: the-arcanum-project
    observed_project: arcanum
    reads: [projects, deployments, logs, domains, environment_metadata]
    writes: [deploy, promote, rollback, configure]
    write_gate: explicit_human_request

  google_workspace:
    status: connected_observed
    authority: working_context
    canonicality: non_canonical
    permission_classes: [R1, W1]
    observed_profile: the-architect@the-arcanum.net
    surfaces: [drive, docs, sheets, slides, gmail, calendar, contacts]
    rule: ratified_results_must_return_to_repository_canon

  notion:
    status: unverified
    authority: working_knowledge
    canonicality: non_canonical
    permission_classes: [R1, W1]

  web:
    status: available
    authority: external_evidence
    canonicality: evidentiary_only
    permission_classes: [R0]

  local_termux:
    status: verified
    authority: local_verification
    canonicality: verification_evidence_only
    permission_classes: [R1, W2]
    bootstrap: scripts/mobile/termux-bootstrap.sh
    verify: scripts/mobile/termux-verify.sh
    orchestration: scripts/architect/orchestrate.sh

source_authority_order:
  - canonical_doctrine
  - ratified_governance
  - live_repository_code
  - github_branch_and_commit_state
  - ci_evidence
  - deployment_evidence
  - connected_workspace_context
  - external_research
  - model_inference

hard_rules:
  - no_write_without_explicit_authorization
  - no_merge_or_deploy_without_verification_evidence
  - no_connected_workspace_document_may_silently_become_canon
  - no_tool_output_may_override_doctrine
  - no_fabricated_live_state
  - permission_denial_must_be_distinguished_from_missing_data
  - constitutional_changes_require_impact_reporting
  - every_external_action_must_be_attributable_to_a_permission_class

agent_fabric:
  status: registered_plan_only
  registry: docs/governance/architectgpt/agent-registry.yaml
  protocol: docs/governance/architectgpt/agent-invocation-protocol.md
  runner: scripts/architect/agent-run.py
  authority: evidentiary_only
  default_policy: deny
  permission_ceiling: R1
  execution_enabled: false
  connected_private_reads_enabled: false
  external_writes_enabled: false
  agents:
    repository_architect:
      status: registered
      permission_ceiling: R1
    canon_guardian:
      status: registered
      permission_ceiling: R1
    product_steward:
      status: registered
      permission_ceiling: R1
    security_sentinel:
      status: registered
      permission_ceiling: R1
    verification_oracle:
      status: registered
      permission_ceiling: R1
    release_steward:
      status: registered
      permission_ceiling: R1
  hard_rules:
    - agent_identity_must_be_registered
    - requested_permission_must_not_exceed_ceiling
    - requested_tools_must_be_allowlisted
    - every_invocation_must_bind_exact_commit
    - every_invocation_must_produce_deterministic_attestation
    - no_agent_tool_execution_in_wave_xviii
    - human_architect_retains_all_action_authority

promotion_orchestration:
  status: active_guarded_coordination
  protocol: docs/governance/architectgpt/promotion-orchestrator-protocol.md
  schema: docs/governance/architectgpt/promotion-orchestrator.schema.json
  entrypoint: scripts/architect/promote-wave.sh
  orchestrator: scripts/architect/promotion-orchestrator.py
  state_directory: .architect-reports/orchestration/waves
  default_mode: dry_run
  pre_w3_authority: bounded_coordination
  merge_authority: explicit_w3_only
  exact_head_required: true
  expected_head_guard_required: true
  clean_checkout_required: true
  remote_sync_required: true
  deterministic_state_required: true
  resumable_state_required: true
  exact_ci_required: true
  exact_provider_preview_required: true
  single_pull_request_required: true
  automatic_merge_enabled: false
  automatic_deployment_enabled: false
  automatic_mobile_sync_enabled: false
  delegated_merge_executor: scripts/architect/merge-executor.py
  hard_rules:
    - fail_closed_on_head_drift
    - fail_closed_on_state_digest_mismatch
    - fail_closed_on_evidence_identity_mismatch
    - fail_closed_on_pull_request_identity_mismatch
    - no_merge_without_explicit_w3
    - no_merge_without_exact_request_digest_confirmation
    - no_mutation_outside_delegated_merge_executor
    - human_architect_retains_final_merge_authority
