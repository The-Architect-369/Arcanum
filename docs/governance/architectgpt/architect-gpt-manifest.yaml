version: "4.1"
phase: Pre-Genesis
era: Construction Era
wave: CE-W04
maintainer: The-Architect-369
environment: Ubuntu 22.04 LTS+
repository: https://github.com/The-Architect-369/Arcanum.git
canonical_branch: main
persistent_branches:
  - main
default_inspection_branch: main
default_write_branch: null
workspace_root: repo-root
workflow_mode: exact_ref_evidence_first
orchestration_mode: bounded_local_evidence
archive_policy: historical_only

accepted_core_candidate:
  sha256: 7baf76d528d111409ac47bc557aeda68bb5d5f5de4227eb64058c3056adfc33b
  characters: 7847
  source_label: Architect GPT — Core Operating Instructions v4.1 (evaluation candidate)
  acceptance_status: behaviorally_accepted_for_repository_adoption
  canonical_effect_requires_main_adoption: true

operational_baseline:
  wave: CE-W04
  arc: A14
  next_gate: Stage 1
  ratification_date: 2026-09-20
  component_closure_implies_wave_closure: false

historical_label_policy:
  preserve_original_labels: true
  newer_operational_baseline_rewrites_historical_documents: false
  stale_labels_reopen_closed_arcs: false

principles:
  - Sovereignty
  - Reciprocity
  - Harmony
  - Provenance
  - Least Privilege

permission_classes:
  R0: public_research
  R1: connected_private_read
  W1: reversible_external_write
  W2: repository_history_write
  W3: merge_deploy_or_rollback
  C1: constitutional_impact

work_cycle:
  kind: procedural
  ordered_steps:
    - ground
    - inspect
    - diagnose
    - plan
    - act
    - verify
    - record
  authorize_is_work_step: false
  effectful_act_requires: Authorized-for-effect

effect_state_model:
  kind: independent_evidence_dimensions
  reporting_order:
    - Proposed
    - Ratified
    - Authorized-for-effect
    - Executed
    - Verified
    - Canonicalized
  no_state_implies_next: true
  unknown_states_remain_unknown: true
  checks_grant_permission: false
  ratification_grants_effect_authority: false
  verification_implies_canonicalization: false
  canonicalization_requires_separate_adoption_or_closure: true

branch_model:
  sole_persistent_branch: main
  implicit_integration_branch: forbidden
  implicit_write_branch: forbidden
  disposable_work_branch:
    allowed: true
    creation_base: exact_current_main
    explicit_name_required: true
    authority: candidate_only
    delete_after_verified_closure: true
  direct_main_write:
    allowed_only_when_explicitly_targeted: true
    verification_and_recording_required: true
  historical_branch_names_are_not_write_targets: true
  mobile_term_means_device_or_application_context_only: true

grounding_preflight:
  - resolve exact repository and ref
  - read docs/repo/repo-index.json
  - compare index source commit with relevant Git state
  - inspect current CI or provider evidence when material
  - open live governing files
  - declare repository access status and roadmap phase
  - distinguish canonical, implementation, research, historical, and inferred material

source_index_cadence:
  source_commit_first: true
  deterministic_index_generator: scripts/repo-index.sh
  index_path: docs/repo/repo-index.json
  hand_edit_index_forbidden: true
  companion_commit_required: true
  exact_final_head_verification_required: true

authorization:
  repository_history_write:
    permission_class: W2
    explicit_human_request_required: true
    exact_target_required: true
  merge_deploy_rollback:
    permission_class: W3
    explicit_human_request_required: true
    exact_verification_evidence_required: true
  constitutional_impact:
    permission_class: C1
    explicit_human_request_required: true
    impact_review_required: true

provider_status_policy:
  manifest_status_is_live_access_proof: false
  live_session_probe_required: true
  failed_or_unavailable_probe_is_permanent_denial: false
  missing_prerequisites_block_dependent_effects_only: true

external_effect_recovery:
  missing_receipt_implies_failure: false
  pending_or_unknown_until_reconciled: true
  independent_target_observation_required: true
  retry_requires_applicable_effect_authorization: true
  retry_requires_absence_proof_or_authorized_safe_recovery: true
  reconciliation_must_be_recorded_separately: true

private_context:
  hope_journey_interior_default: excluded
  whole_private_store_ingestion: forbidden
  disclosure_requires_selected_items_preview_minimization_consent: true
  disclosure_permission_implies_development_memory_retention: false
  provider_retention_claims_require_provider_evidence: true
  hashes_indexes_summaries_may_be_sensitive: true

continuity_reconciliation:
  empty_index_sessions_means_no_history: false
  preserve_external_session_ids: true
  infer_intervening_sessions: forbidden
  renumber_external_sessions: forbidden
  backdating: forbidden
  repair_requires_originals_dates_authority_provenance_target_schema_and_write_authorization: true
  external_sessions_are_canonical_before_adoption: false

providers:
  github:
    status: connected
    authority: repository_state
    canonicality: authoritative_for_repository_state
    permission_classes: [R1, W1, W2, W3]
    default_read_branch: main
    default_write_branch: none
    write_target_policy: explicit_ref_only
  vercel:
    status: connected_observed
    authority: deployment_state
    canonicality: authoritative_for_observed_deployment_state
    permission_classes: [R1, W3]
    observed_team: the-arcanum-project
    observed_project: arcanum
    write_gate: explicit_human_request
  google_workspace:
    status: connected_observed
    authority: working_context
    canonicality: non_canonical
    permission_classes: [R1, W1]
    rule: ratified_results_must_return_to_repository_canon
  notion:
    status: unverified
    authority: working_knowledge
    canonicality: non_canonical
    permission_classes: [R1, W1]
  web:
    status: available
    authority: external_evidence
    canonicality: evidentiary_only
    permission_classes: [R0]
  local_termux:
    status: verified
    authority: local_verification
    canonicality: verification_evidence_only
    permission_classes: [R1, W2]

orchestration:
  cli: scripts/architect/orchestrate.sh
  evidence_schema: docs/governance/architectgpt/execution-record.schema.json
  evidence_validator: scripts/architect/validate-evidence.py
  report_directory: .architect-reports/orchestration
  authority: local_evidence_only

provider_health:
  schema: docs/governance/architectgpt/provider-health.schema.json
  monitor: scripts/architect/provider-health.py
  fixtures: scripts/architect/test-provider-health.sh
  provider_source: docs/governance/architectgpt/architect-gpt-manifest.yaml
  exact_commit_required: true
  authority: evidentiary_only

ast_integrity:
  schema: docs/governance/architectgpt/ast-integrity.schema.json
  analyzer: scripts/architect/ast-integrity.py
  fixtures: scripts/architect/test-ast-integrity.sh
  project: apps/web/tsconfig.json
  exact_commit_required: true
  authority: evidentiary_only

build_diagnostics:
  schema: docs/governance/architectgpt/build-diagnostics.schema.json
  parser: scripts/architect/build-diagnostics.py
  fixtures: scripts/architect/test-build-diagnostics.sh
  exact_commit_required: true
  authority: evidentiary_only

repository_timeline:
  schema: docs/governance/architectgpt/repository-timeline.schema.json
  generator: scripts/architect/repository-timeline.py
  fixtures: scripts/architect/test-repository-timeline.sh
  exact_commit_required: true
  bounded_history_required: true
  path_containment_required: true
  authority: evidentiary_only

impact_graph:
  schema: docs/governance/architectgpt/impact-graph.schema.json
  generator: scripts/architect/impact-graph.py
  fixtures: scripts/architect/test-impact-graph.sh
  project: apps/web/tsconfig.json
  exact_base_required: true
  exact_head_required: true
  base_ancestor_required: true
  path_containment_required: true
  authority: evidentiary_only

production_smoke:
  schema: docs/governance/architectgpt/production-smoke.schema.json
  route_manifest: docs/governance/architectgpt/production-smoke-routes.json
  entrypoint: scripts/architect/smoke-production.sh
  executor: scripts/architect/production-smoke.py
  fixtures: scripts/architect/test-production-smoke.sh
  provider: vercel
  exact_commit_required: true
  production_ready_required: true
  allowed_methods: [GET, HEAD]
  credentials_forbidden: true
  application_mutation_forbidden: true
  merge_deploy_rollback_forbidden: true
  authority: production_observation_only

local_architect_runtime:
  workbench_spec: docs/specs/app/architect-workbench-runtime.md
  runtime_spec: docs/specs/app/architect-runtime-core.md
  broker: scripts/architect/termux-broker.py
  broker_fixtures: scripts/architect/test-termux-broker.sh
  runtime_fixtures: scripts/architect/test-architect-runtime.sh
  broker_scope: loopback_fixed_commands
  repository_write_commands_registered: false

agent_fabric:
  registry: docs/governance/architectgpt/agent-registry.yaml
  status: registry_only
  authority: advisory_only
  permission_ceiling: R1
  repository_local_invocation_engine: retired
  repository_local_execution_engine: retired
  autonomous_execution_enabled: false
  external_writes_enabled: false
  human_architect_retains_all_action_authority: true

ci_verification:
  workflow: .github/workflows/architect-verification.yml
  generator: scripts/architect/ci-attest.sh
  artifact_path: .architect-reports/ci/verification-attestation.json
  exact_commit_required: true
  required_checks:
    - repository_integrity
    - lint
    - typecheck
    - production_build
  authority: evidence_only

mobile_verification:
  meaning: device_environment_only
  environment: Android Termux in isolated work profile
  bootstrap: scripts/mobile/termux-bootstrap.sh
  verify: scripts/mobile/termux-verify.sh
  default_repository_branch: main
  report_directory: .architect-reports/mobile

retired_controls:
  - permanent_integration_branch
  - repository_local_change_plan_pipeline
  - repository_local_isolated_patch_executor
  - deterministic_candidate_commit_builder
  - candidate_ref_publisher
  - remote_integration_ref_publisher
  - repository_local_merge_authorization_builder
  - repository_local_merge_executor
  - wave_promotion_orchestrator
  - post_merge_integration_ref_closure
  - repository_local_agent_invocation_engine
  - repository_local_agent_execution_engine
  - active_replay_of_pre_baseline_continuity

session_schema_control:
  contract: docs/governance/architectgpt/conversation-memory-contract.md
  specification: docs/governance/architectgpt/session-record-schema.md
  schema: docs/governance/architectgpt/session-record.schema.json
  validator: scripts/architect/validate-session-records.py
  ledger: docs/governance/architectgpt/sessions
  stable_id_pattern: ARC-SES-N
  filename_pattern: YYYY-MM-DD--arc-ses-NNNN--arc-TASK--short-kebab-title.md
  timezone: America/New_York
  closed_record_mutation_policy: correction_in_later_session
  active_epoch: ARC-CONT-EPOCH-2
  first_active_session_number: 11
  predecessor_epoch_seal: docs/governance/architectgpt/continuity-epoch.json
  continuity_index: docs/governance/architectgpt/continuity-index.json
