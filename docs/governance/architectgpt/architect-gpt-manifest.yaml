  continuity_index_schema: docs/governance/architectgpt/continuity-index.schema.json
  continuity_index: docs/governance/architectgpt/continuity-index.json
  execution_record_schema: docs/governance/architectgpt/execution-record.schema.json
  provider_health_schema: docs/governance/architectgpt/provider-health.schema.json
  ast_integrity_schema: docs/governance/architectgpt/ast-integrity.schema.json
  build_diagnostics_schema: docs/governance/architectgpt/build-diagnostics.schema.json
  repository_timeline_schema: docs/governance/architectgpt/repository-timeline.schema.json
  impact_graph_schema: docs/governance/architectgpt/impact-graph.schema.json
  production_smoke_schema: docs/governance/architectgpt/production-smoke.schema.json
  production_smoke_routes: docs/governance/architectgpt/production-smoke-routes.json
  repo_interface: docs/repo/repo-interface.md
