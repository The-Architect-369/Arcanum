version: 3.5
phase: Pre-Genesis
maintainer: The-Architect-369
environment: Ubuntu 22.04 LTS+
repository: https://github.com/The-Architect-369/Arcanum.git
default_branch: main
stable_branch: main
integration_branch: mobile
default_inspection_branch: main
default_write_branch: mobile
default_workspace_root: repo-root
sync_cycle: 14_days
workflow_mode: github_first
orchestration_mode: capability_fabric
merge_policy: human-approved-after-green-verification
wave_completion_policy: guarded_merge_after_each_green_wave
write_policy: explicit-request-and-visible-permission
default_patch_surface: python3
archive_policy: historical-only

principles:
  - Sovereignty
  - Reciprocity
  - Harmony
  - Provenance
  - Least Privilege

permission_classes:
  R0: public_research
  R1: connected_private_read
  W1: reversible_external_write
  W2: repository_history_write
  W3: merge_deploy_or_rollback
  C1: constitutional_impact

workflow_states:
  - ground
  - inspect
  - diagnose
  - plan
  - authorize
  - act
  - verify
  - record

default_repo_aliases:
  - my repo
  - the repo
  - check my repo
  - check Arcanum

grounding_preflight:
  - resolve repository automatically
  - resolve branch from task intent
  - read docs/repo/repo-index.json
  - inspect generated_at and commit
  - compare index commit with visible branch head
  - verify sync evidence before deeper analysis
  - open relevant live files before substantive analysis
  - declare provider and source provenance

solve_method:
  - establish grounding state and branch role
  - inspect the active failure or change surface first
  - isolate the current hard blocker
  - produce the smallest coherent fix
  - prefer direct GitHub branch updates when write mode is active
  - otherwise prefer Python patch scripts for multi-file edits on Ubuntu
  - rerun pnpm -C apps/web typecheck when local verification is available
  - rerun pnpm -C apps/web build when local verification is available
  - capture verification evidence
  - execute the promotion gate after a wave is locally green
  - require CI-native promotion evidence before guarded merge
  - only then merge or hand off toward main if explicitly requested

capability_rules:
  registry: docs/governance/architectgpt/capability-registry.yaml
  default: deny
  write_gate: explicit_human_request
  merge_deploy_gate: explicit_request_and_green_evidence
  workspace_canonicality: non_canonical
  ratified_output_destination: repository

orchestration_control:
  cli: scripts/architect/orchestrate.sh
  commands: [preflight, session, record, evidence, validate, migrate]
  report_directory: .architect-reports/orchestration
  execution_log: .architect-reports/orchestration/execution.jsonl
  provider_evidence_log: .architect-reports/orchestration/provider-evidence.jsonl
  record_format: jsonl
  evidence_schema: docs/governance/architectgpt/execution-record.schema.json
  evidence_validator: scripts/architect/validate-evidence.py

promotion_control:
  gate: scripts/architect/promotion-gate.sh
  protocol: docs/governance/architectgpt/promotion-protocol.md
  attestation_directory: .architect-reports/orchestration/promotions
  required_branch: mobile
  required_remote: origin/mobile
  exact_head_evidence: true
  vercel_exact_head_required: true
  merge_guard: expected_head_sha

ci_promotion_control:
  workflow: .github/workflows/architect-promotion.yml
  protocol: docs/governance/architectgpt/ci-promotion-protocol.md
  generator: scripts/architect/ci-attest.sh
  artifact_path: .architect-reports/ci/promotion-attestation.json
  exact_commit_required: true
  required_checks: [repository_integrity, typecheck, production_build]

provider_health_control:
  registry: docs/governance/architectgpt/capability-registry.yaml
  protocol: docs/governance/architectgpt/provider-health-protocol.md
  snapshot_schema: docs/governance/architectgpt/provider-health.schema.json
  monitor: scripts/architect/provider-health.py
  report_directory: .architect-reports/orchestration/provider-health
  exact_commit_required: true
  default_max_age_hours: 24
  health_states: [healthy, degraded, unavailable, unverified]
  authority: evidentiary_only

change_plan_control:
  protocol: docs/governance/architectgpt/change-plan-protocol.md
  schema: docs/governance/architectgpt/change-plan.schema.json
  generator: scripts/architect/change-plan.py
  fixtures: scripts/architect/test-change-plan.sh
  report_directory: .architect-reports/orchestration/change-plans
  required_branch: mobile
  exact_base_required: true
  deterministic_bundle_required: true
  supported_actions: [create, update, delete, rename]
  authority: evidentiary_only

ast_integrity_control:
  protocol: docs/governance/architectgpt/ast-integrity-protocol.md
  report_schema: docs/governance/architectgpt/ast-integrity.schema.json
  analyzer: scripts/architect/ast-integrity.py
  fixtures: scripts/architect/test-ast-integrity.sh
  project: apps/web/tsconfig.json
  package_manifest: apps/web/package.json
  report_directory: .architect-reports/orchestration/ast-integrity
  exact_commit_required: true
  deterministic_report_required: true
  required_checks: [compiler, local_import_resolution, declared_dependencies, dependency_cycles]
  authority: evidentiary_only

build_diagnostics_control:
  protocol: docs/governance/architectgpt/build-diagnostics-protocol.md
  report_schema: docs/governance/architectgpt/build-diagnostics.schema.json
  parser: scripts/architect/build-diagnostics.py
  fixtures: scripts/architect/test-build-diagnostics.sh
  report_directory: .architect-reports/orchestration/build-diagnostics
  exact_commit_required: true
  deterministic_report_required: true
  categories: [typescript, module_resolution, environment, nextjs, runtime_boundary, warning]
  provider_metadata: [provider, deployment_id, environment, state, branch, commit]
  authority: evidentiary_only

repository_timeline_control:
  protocol: docs/governance/architectgpt/repository-timeline-protocol.md
  report_schema: docs/governance/architectgpt/repository-timeline.schema.json
  generator: scripts/architect/repository-timeline.py
  fixtures: scripts/architect/test-repository-timeline.sh
  report_directory: .architect-reports/orchestration/repository-timeline
  exact_commit_required: true
  deterministic_report_required: true
  bounded_history_required: true
  path_containment_required: true
  node_fields: [commit, parents, timestamp, author, subject, blob_sha, content_sha256, diff]
  edge_relation: superseded_by
  rollback_authority: none
  authority: evidentiary_only

impact_graph_control:
  protocol: docs/governance/architectgpt/impact-graph-protocol.md
  report_schema: docs/governance/architectgpt/impact-graph.schema.json
  generator: scripts/architect/impact-graph.py
  fixtures: scripts/architect/test-impact-graph.sh
  project: apps/web/tsconfig.json
  report_directory: .architect-reports/orchestration/impact-graph
  exact_base_required: true
  exact_head_required: true
  deterministic_report_required: true
  base_ancestor_required: true
  path_containment_required: true
  impact_surfaces: [changed_files, direct_dependents, transitive_dependents, routes, packages, tests, runtime_surfaces, canonical_documents]
  verification_categories: [repository_integrity, web_typecheck, web_production_build, targeted_tests, browser_route_smoke, deployment_preview, doctrine_guard]
  authority: evidentiary_only

isolated_patch_executor_control:
  protocol: docs/governance/architectgpt/patch-executor-protocol.md
  attestation_schema: docs/governance/architectgpt/patch-executor.schema.json
  executor: scripts/architect/patch-executor.py
  fixtures: scripts/architect/test-patch-executor.sh
  report_directory: .architect-reports/orchestration/patch-executor
  required_branch: mobile
  exact_base_required: true
  clean_source_required: true
  detached_worktree_required: true
  deterministic_attestation_required: true
  declared_mutation_match_required: true
  payload_digest_required: [create, update]
  supported_actions: [create, update, delete, rename]
  forbidden_actions: [commit, push, ref_update, merge, deploy]
  isolation_scope: git_worktree_only
  verification_command_trust: trusted_repository_commands_only
  authority: evidentiary_only

candidate_commit_control:
  protocol: docs/governance/architectgpt/candidate-commit-protocol.md
  schema: docs/governance/architectgpt/candidate-commit.schema.json
  builder: scripts/architect/candidate-commit.py
  fixtures: scripts/architect/test-candidate-commit.sh
  report_directory: .architect-reports/orchestration/candidate-commits
  required_branch: mobile
  exact_base_required: true
  clean_source_required: true
  patch_attestation_required: true
  deterministic_commit_required: true
  deterministic_attestation_required: true
  single_parent_required: true
  source_checkout_unchanged_required: true
  refs_unchanged_required: true
  object_store_effect: unreachable_commit_object
  forbidden_actions: [head_update, branch_update, tag_update, push, merge, deploy]
  authority: evidentiary_only

candidate_ref_publisher_control:
  protocol: docs/governance/architectgpt/candidate-publisher-protocol.md
  schema: docs/governance/architectgpt/candidate-publisher.schema.json
  publisher: scripts/architect/candidate-publisher.py
  fixtures: scripts/architect/test-candidate-publisher.sh
  report_directory: .architect-reports/orchestration/candidate-publications
  required_branch: mobile
  required_local_ref: refs/heads/mobile
  required_remote_tracking_ref: refs/remotes/origin/mobile
  exact_base_required: true
  clean_source_required: true
  candidate_attestation_required: true
  dry_run_default: true
  explicit_request_digest_confirmation_required: true
  fast_forward_only: true
  allowed_effect: local_mobile_fast_forward
  forbidden_actions: [push, remote_ref_update, main_update, merge, deploy]
  dry_run_authority: evidentiary_only
  apply_authority: local_repository_write_only

remote_ref_publisher_control:
  protocol: docs/governance/architectgpt/remote-publisher-protocol.md
  schema: docs/governance/architectgpt/remote-publisher.schema.json
  publisher: scripts/architect/remote-publisher.py
  fixtures: scripts/architect/test-remote-publisher.sh
  report_directory: .architect-reports/orchestration/remote-publications
  required_branch: mobile
  required_remote: origin
  required_target_ref: refs/heads/mobile
  local_publication_attestation_required: true
  exact_candidate_required: true
  exact_remote_lease_required: true
  clean_source_required: true
  dry_run_default: true
  explicit_request_digest_confirmation_required: true
  permission_class: W2
  allowed_effect: origin_mobile_fast_forward
  forbidden_actions: [main_update, tag_update, merge, deploy]
  dry_run_authority: evidentiary_only
  apply_authority: remote_integration_ref_write_only

merge_authorization_control:
  protocol: docs/governance/architectgpt/merge-authorization-protocol.md
  schema: docs/governance/architectgpt/merge-authorization.schema.json
  builder: scripts/architect/merge-authorization.py
  fixtures: scripts/architect/test-merge-authorization.sh
  report_directory: .architect-reports/orchestration/merge-authorizations
  required_head_branch: mobile
  required_base_branch: main
  permission_class: W3
  explicit_human_authorization_required: true
  promotion_attestation_required: true
  ci_attestation_required: true
  provider_readiness_required: true
  exact_head_required: true
  expected_head_guard_required: true
  deterministic_package_required: true
  allowed_effect: authorization_package_only
  forbidden_actions: [pr_create, commit, push, ref_update, merge, deploy]
  authority: evidentiary_only

merge_executor_control:
  protocol: docs/governance/architectgpt/merge-executor-protocol.md
  schema: docs/governance/architectgpt/merge-executor.schema.json
  executor: scripts/architect/merge-executor.py
  fixtures: scripts/architect/test-merge-executor.sh
  report_directory: .architect-reports/orchestration/merge-executions
  required_head_branch: mobile
  required_base_branch: main
  required_remote: origin
  permission_class: W3
  merge_authorization_package_required: true
  explicit_human_authorization_required: true
  request_digest_confirmation_required: true
  exact_head_required: true
  expected_head_guard_required: true
  dry_run_default: true
  merge_method: merge
  allowed_effect: expected_head_protected_pull_request_merge
  forbidden_actions: [pr_create, direct_push, tag_update, mobile_update, deploy, rollback]
  dry_run_authority: evidentiary_only
  apply_authority: pull_request_merge_only

agent_invocation_control:
  registry: docs/governance/architectgpt/agent-registry.yaml
  protocol: docs/governance/architectgpt/agent-invocation-protocol.md
  schema: docs/governance/architectgpt/agent-invocation.schema.json
  runner: scripts/architect/agent-run.py
  fixtures: scripts/architect/test-agent-run.sh
  report_directory: .architect-reports/orchestration/agent-invocations
  required_branch: mobile
  exact_commit_required: true
  registry_default_policy: deny
  explicit_human_authorization_required: true
  permission_ceiling_required: true
  tool_allowlist_required: true
  deterministic_attestation_required: true
  initial_agents:
    - repository_architect
    - canon_guardian
    - product_steward
    - security_sentinel
    - verification_oracle
    - release_steward
  mode: plan_only
  tools_executed: false
  external_writes_performed: false
  forbidden_actions:
    - tool_execution
    - connected_private_read
    - file_write
    - commit
    - ref_update
    - push
    - pull_request_create
    - merge
    - deploy
    - rollback
    - ratify
  authority: evidentiary_only

