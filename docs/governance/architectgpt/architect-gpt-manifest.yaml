  continuity_index_schema: docs/governance/architectgpt/continuity-index.schema.json
  continuity_index_generator: scripts/architect/generate-continuity-index.py
  continuity_index_validator: scripts/architect/validate-continuity-index.py
  authority: continuity_metadata_only

session_continuity_control:
  contract: docs/governance/architectgpt/conversation-memory-contract.md
  mode: sealed_predecessor_active_epoch
  predecessor_epoch:
    epoch_id: ARC-CONT-EPOCH-1
    status: sealed
    seal_path: docs/governance/architectgpt/continuity-epoch.json
    sealed_through_commit: 1212f02b61ab0895a84700b9371847a6c5ebe47f
    active_body_replay: forbidden
    git_history_verification_required: true
  active_epoch:
    epoch_id: ARC-CONT-EPOCH-2
    status: active
    first_session_number: 11
    controlling_log: docs/governance/architectgpt/architect-log.md
    session_ledger: docs/governance/architectgpt/sessions
  missing_record_behavior:
    silent_reconstruction_forbidden: true
    inference_as_repair_forbidden: true
    fail_closed_validation_preserved: true

files:
