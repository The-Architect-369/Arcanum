version: 3.5
phase: Pre-Genesis
maintainer: The-Architect-369
environment: Ubuntu 22.04 LTS+
repository: https://github.com/The-Architect-369/Arcanum.git
default_branch: main
stable_branch: main
integration_branch: mobile
default_inspection_branch: main
default_write_branch: mobile
default_workspace_root: repo-root
sync_cycle: 14_days
workflow_mode: github_first
orchestration_mode: capability_fabric
merge_policy: human-approved-after-green-verification
wave_completion_policy: guarded_merge_after_each_green_wave
write_policy: explicit-request-and-visible-permission
default_patch_surface: python3
archive_policy: historical-only

principles:
  - Sovereignty
  - Reciprocity
  - Harmony
  - Provenance
  - Least Privilege

permission_classes:
  R0: public_research
  R1: connected_private_read
  W1: reversible_external_write
  W2: repository_history_write
  W3: merge_deploy_or_rollback
  C1: constitutional_impact

workflow_states:
  - ground
  - inspect
  - diagnose
  - plan
  - authorize
  - act
  - verify
  - record

default_repo_aliases:
  - my repo
  - the repo
  - check my repo
  - check Arcanum

grounding_preflight:
  - resolve repository automatically
  - resolve branch from task intent
  - read docs/repo/repo-index.json
  - inspect generated_at and commit
  - compare index commit with visible branch head
  - verify sync evidence before deeper analysis
  - open relevant live files before substantive analysis
  - declare provider and source provenance

solve_method:
  - establish grounding state and branch role
  - inspect the active failure or change surface first
  - isolate the current hard blocker
  - produce the smallest coherent fix
  - prefer direct GitHub branch updates when write mode is active
  - otherwise prefer Python patch scripts for multi-file edits on Ubuntu
  - rerun pnpm -C apps/web typecheck when local verification is available
  - rerun pnpm -C apps/web build when local verification is available
  - capture verification evidence
  - execute the promotion gate after a wave is locally green
  - require CI-native promotion evidence before guarded merge
  - only then merge or hand off toward main if explicitly requested

capability_rules:
  registry: docs/governance/architectgpt/capability-registry.yaml
  default: deny
  write_gate: explicit_human_request
  merge_deploy_gate: explicit_request_and_green_evidence
  workspace_canonicality: non_canonical
  ratified_output_destination: repository

orchestration_control:
  cli: scripts/architect/orchestrate.sh
  commands: [preflight, session, record, evidence, validate, migrate]
  report_directory: .architect-reports/orchestration
  execution_log: .architect-reports/orchestration/execution.jsonl
  provider_evidence_log: .architect-reports/orchestration/provider-evidence.jsonl
  record_format: jsonl
  evidence_schema: docs/governance/architectgpt/execution-record.schema.json
  evidence_validator: scripts/architect/validate-evidence.py

promotion_control:
  gate: scripts/architect/promotion-gate.sh
  protocol: docs/governance/architectgpt/promotion-protocol.md
  attestation_directory: .architect-reports/orchestration/promotions
  required_branch: mobile
  required_remote: origin/mobile
  exact_head_evidence: true
  vercel_exact_head_required: true
  merge_guard: expected_head_sha

ci_promotion_control:
  workflow: .github/workflows/architect-promotion.yml
  protocol: docs/governance/architectgpt/ci-promotion-protocol.md
  generator: scripts/architect/ci-attest.sh
  artifact_path: .architect-reports/ci/promotion-attestation.json
  exact_commit_required: true
  required_checks: [repository_integrity, typecheck, production_build]

provider_health_control:
  registry: docs/governance/architectgpt/capability-registry.yaml
  protocol: docs/governance/architectgpt/provider-health-protocol.md
  snapshot_schema: docs/governance/architectgpt/provider-health.schema.json
  monitor: scripts/architect/provider-health.py
  report_directory: .architect-reports/orchestration/provider-health
  exact_commit_required: true
  default_max_age_hours: 24
  health_states: [healthy, degraded, unavailable, unverified]
  authority: evidentiary_only

change_plan_control:
  protocol: docs/governance/architectgpt/change-plan-protocol.md
  schema: docs/governance/architectgpt/change-plan.schema.json
  generator: scripts/architect/change-plan.py
  fixtures: scripts/architect/test-change-plan.sh
  report_directory: .architect-reports/orchestration/change-plans
  required_branch: mobile
  exact_base_required: true
  deterministic_bundle_required: true
  supported_actions: [create, update, delete, rename]
  authority: evidentiary_only

ast_integrity_control:
  protocol: docs/governance/architectgpt/ast-integrity-protocol.md
  report_schema: docs/governance/architectgpt/ast-integrity.schema.json
  analyzer: scripts/architect/ast-integrity.py
  fixtures: scripts/architect/test-ast-integrity.sh
  project: apps/web/tsconfig.json
  package_manifest: apps/web/package.json
  report_directory: .architect-reports/orchestration/ast-integrity
  exact_commit_required: true
  deterministic_report_required: true
  required_checks: [compiler, local_import_resolution, declared_dependencies, dependency_cycles]
  authority: evidentiary_only

build_diagnostics_control:
  protocol: docs/governance/architectgpt/build-diagnostics-protocol.md
  report_schema: docs/governance/architectgpt/build-diagnostics.schema.json
  parser: scripts/architect/build-diagnostics.py
  fixtures: scripts/architect/test-build-diagnostics.sh
  report_directory: .architect-reports/orchestration/build-diagnostics
  exact_commit_required: true
  deterministic_report_required: true
  categories: [typescript, module_resolution, environment, nextjs, runtime_boundary, warning]
  provider_metadata: [provider, deployment_id, environment, state, branch, commit]
  authority: evidentiary_only

mobile_verification:
  environment: Android Termux in isolated work profile
  bootstrap: scripts/mobile/termux-bootstrap.sh
  verify: scripts/mobile/termux-verify.sh
  report_directory: .architect-reports/mobile

observed_providers:
  github: connected
  google_workspace: connected_observed
  vercel: connected_observed
  notion: unverified

files:
  architect_gpt: docs/governance/architectgpt/architect-gpt.md
  architect_gpt_manifest: docs/governance/architectgpt/architect-gpt-manifest.yaml
  capability_registry: docs/governance/architectgpt/capability-registry.yaml
  capability_fabric: docs/governance/architectgpt/capability-fabric.md
  orchestration_protocol: docs/governance/architectgpt/orchestration-protocol.md
  evidence_protocol: docs/governance/architectgpt/evidence-protocol.md
  execution_record_schema: docs/governance/architectgpt/execution-record.schema.json
  promotion_protocol: docs/governance/architectgpt/promotion-protocol.md
  ci_promotion_protocol: docs/governance/architectgpt/ci-promotion-protocol.md
  provider_health_protocol: docs/governance/architectgpt/provider-health-protocol.md
  provider_health_schema: docs/governance/architectgpt/provider-health.schema.json
  change_plan_protocol: docs/governance/architectgpt/change-plan-protocol.md
  change_plan_schema: docs/governance/architectgpt/change-plan.schema.json
  ast_integrity_protocol: docs/governance/architectgpt/ast-integrity-protocol.md
  ast_integrity_schema: docs/governance/architectgpt/ast-integrity.schema.json
  build_diagnostics_protocol: docs/governance/architectgpt/build-diagnostics-protocol.md
  build_diagnostics_schema: docs/governance/architectgpt/build-diagnostics.schema.json
  hope_guardian: docs/governance/hopegpt/hope-guardian.md
  repo_interface: docs/repo/repo-interface.md
  repo_index: docs/repo/repo-index.json
  verify_script: scripts/verify-sync.sh
  orchestration_cli: scripts/architect/orchestrate.sh
  evidence_validator: scripts/architect/validate-evidence.py
  promotion_gate: scripts/architect/promotion-gate.sh
  ci_attestation_generator: scripts/architect/ci-attest.sh
  ci_promotion_workflow: .github/workflows/architect-promotion.yml
  provider_health_monitor: scripts/architect/provider-health.py
  change_plan_generator: scripts/architect/change-plan.py
  change_plan_fixtures: scripts/architect/test-change-plan.sh
  ast_integrity_analyzer: scripts/architect/ast-integrity.py
  ast_integrity_fixtures: scripts/architect/test-ast-integrity.sh
  build_diagnostics_parser: scripts/architect/build-diagnostics.py
  build_diagnostics_fixtures: scripts/architect/test-build-diagnostics.sh
  mobile_bootstrap: scripts/mobile/termux-bootstrap.sh
  mobile_verify: scripts/mobile/termux-verify.sh

legacy_archive_files:
  - docs/archive/architectgpt/architectgpt-core.md
  - docs/archive/architectgpt/architectgpt-extended.md
  - docs/archive/architectgpt/architect-log-legacy.md

active_log: docs/governance/architectgpt/architect-log.md
